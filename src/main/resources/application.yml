spring:
  application:
    name: demo
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  # stub | upstage (7단계에서 upstage 구현 추가)
  analyzer: stub
  extraction:
    # 이 시간을 넘긴 pending은 타임아웃 실패로 확정한다
    timeout: 2m
    sweep-interval: 30s
  rate-limit:
    enabled: true
    # 쿠키를 버리면 초기화되므로 좁게 잡는다
    session:
      limit: 5
      window: 10m
    # 공유망에서 여럿이 함께 쓸 수 있으므로 넉넉하게 잡는다
    ip:
      limit: 60
      window: 10m

upstage:
  base-url: https://api.upstage.ai/v2
  # api-key와 agent-id는 프로파일별 yml에 둔다
  request-timeout: 15s
  poll-interval: 2s
  # 이 시간을 넘기면 upstream_timeout. app.extraction.timeout보다 짧아야 한다.
  poll-timeout: 90s
  # all | last. 결과가 마지막 단계가 아닌 곳에 담길 수 있어 기본은 all.
  include-steps: all
  # 비우면 끔. 켜면 업스트림 원본 응답을 그대로 파일로 남긴다(처방전 내용 포함, 진단용).
  raw-response-dump-dir: ""
