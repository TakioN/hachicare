spring:
  application:
    name: demo
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  # stub | upstage (7단계에서 upstage 구현 추가)
  analyzer: stub
  session:
    # 기본은 안전한 쪽. http로 띄우는 프로파일에서만 내린다.
    cookie-secure: true
    # 프런트와 백엔드가 다른 site면 None이어야 쿠키가 전송된다. None은 Secure 필수.
    cookie-same-site: Lax
  extraction:
    # 이 시간을 넘긴 pending은 타임아웃 실패로 확정한다
    timeout: 2m
    sweep-interval: 30s
  rate-limit:
    enabled: true
    # 쿠키를 버리면 초기화되므로 좁게 잡는다
    session:
      limit: 5
      window: 10m
    # 공유망에서 여럿이 함께 쓸 수 있으므로 넉넉하게 잡는다
    ip:
      limit: 60
      window: 10m
